#
# Build & publish the SelfHelp plugin registry.
#
# Trigger: every push to `main` and every PR against it. The job:
#   1. Validates `registry.json` against `registry.schema.json`.
#   2. Validates every file under `manifests/` against the host's
#      `plugin-manifest.schema.json` (vendored copy below).
#   3. On `main` only: publishes the repo contents (sans the
#      `.github/` and `manifests/.gitkeep` folders) to GitHub Pages.
#
# Every SelfHelp host that has `humdek-public` as a plugin source
# will pick the changes up on the next `Available` tab open — no
# action required on the host side.

name: build-registry

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    validate:
        name: Validate registry + manifests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "22"

            - name: Install ajv-cli
              run: npm install -g ajv-cli ajv-formats

            - name: Validate registry.json
              run: ajv validate -c ajv-formats -s registry.schema.json -d registry.json --strict=false

            - name: Validate unified registry + verify signed core/frontend/scheduler/worker releases
              run: |
                  npm ci || npm install
                  npm run validate:unified

            - name: Registry script unit tests (assemble-release)
              run: npm test

            - name: Guard registry trust fields
              run: node scripts/guard-trust-fields.mjs registry.json

            # Same-branch-or-main: coordinated cross-repo work happens on
            # equally named feature branches. Compare the vendored schema
            # against the backend branch matching this build's branch name
            # when it exists, falling back to main. An explicit
            # HOST_SCHEMA_URL repository variable still overrides both. See
            # sh-selfhelp_backend/docs/developer/branch-merge-order.md.
            - name: Verify plugin-manifest.schema.json is in sync with the host
              env:
                  HOST_SCHEMA_URL: ${{ vars.HOST_SCHEMA_URL }}
              run: |
                  set -euo pipefail
                  RAW_BASE="https://raw.githubusercontent.com/humdek-unibe-ch/sh-selfhelp_backend"
                  SCHEMA_PATH="docs/plugins/plugin-manifest.schema.json"
                  BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
                  if [ -n "${HOST_SCHEMA_URL:-}" ]; then
                      url="$HOST_SCHEMA_URL"
                      echo "Using HOST_SCHEMA_URL override: $url"
                      curl -fsSL "$url" -o /tmp/host-plugin-manifest.schema.json
                  elif [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ] \
                       && curl -fsSL "$RAW_BASE/$BRANCH/$SCHEMA_PATH" -o /tmp/host-plugin-manifest.schema.json 2>/dev/null; then
                      url="$RAW_BASE/$BRANCH/$SCHEMA_PATH"
                      echo "Comparing against host branch '$BRANCH' (same-branch-or-main)."
                  else
                      url="$RAW_BASE/main/$SCHEMA_PATH"
                      echo "Comparing against host main."
                      curl -fsSL "$url" -o /tmp/host-plugin-manifest.schema.json
                  fi
                  local_hash="$(sha256sum plugin-manifest.schema.json | awk '{print $1}')"
                  host_hash="$(sha256sum /tmp/host-plugin-manifest.schema.json | awk '{print $1}')"
                  if [ "$local_hash" != "$host_hash" ]; then
                      echo "::error::plugin-manifest.schema.json drifted from the canonical host copy ($url)."
                      diff plugin-manifest.schema.json /tmp/host-plugin-manifest.schema.json || true
                      exit 1
                  fi
                  echo "plugin-manifest.schema.json is byte-identical to the canonical host copy ($url)."

            - name: Validate plugin manifests (if any)
              run: |
                  set -e
                  if [ -d manifests ]; then
                      shopt -s nullglob
                      for f in manifests/*.json; do
                          echo "Validating $f"
                          ajv validate -c ajv-formats -s plugin-manifest.schema.json -d "$f" --strict=false || exit 1
                      done
                  fi

    publish:
        name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs: validate
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v6

            - name: Prepare site
              run: |
                  mkdir -p _site
                  rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

            # This repo still needs GitHub Pages enabled in repository
            # settings with "GitHub Actions" as the build source. The
            # configure-pages action cannot auto-enable Pages with the
            # default GITHUB_TOKEN.
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

            - id: deployment
              uses: actions/deploy-pages@v4
